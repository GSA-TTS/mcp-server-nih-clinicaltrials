applications:
  - name: nih-clinicaltrials-mcp-server
    buildpacks:
      - python_buildpack
    command: PYTHONPATH=src python -m clinicaltrials.app
    health-check-type: http
    health-check-http-endpoint: /health
    env:
      PYTHONUNBUFFERED: 1
    routes:
      - route: nih-clinicaltrials-mcp-server.app.cloud.gov
    disk_quota: 2G
    memory: 125M